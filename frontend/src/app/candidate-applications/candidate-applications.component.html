<div class="candidate-applications">
  <div class="header">
    <h1>My Applications</h1>
    <a routerLink="/candidate/dashboard" class="btn btn-secondary">Back to Dashboard</a>
  </div>

  <div *ngIf="loading" class="loading">Loading applications...</div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error && applications.length === 0" class="empty-state">
    <p>You haven't applied to any jobs yet.</p>
    <a routerLink="/jobs" class="btn btn-primary">Browse Jobs</a>
  </div>

  <div *ngIf="!loading && !error && applications.length > 0" class="applications-list">
    <div class="application-card" *ngFor="let app of applications">
      <div class="app-header">
        <h3>{{ app.jobTitle }}</h3>
        <span class="status-badge" [ngClass]="getStatusClass(app.status)">{{ app.status }}</span>
      </div>
      <div class="app-details">
        <p class="company">{{ app.companyName }}</p>
        <p class="date">Applied on: {{ app.appliedAtUtc | date:'mediumDate' }}</p>
      </div>
    </div>
  </div>
</div>
