<div class="candidate-dashboard">
  <div class="header">
    <h1>Candidate Dashboard</h1>
    <button (click)="logout()" class="btn btn-secondary">Logout</button>
  </div>

  <div *ngIf="loading" class="loading">Loading profile...</div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error && profile" class="dashboard-content">
    <div class="profile-card">
      <h2>My Profile</h2>
      <div class="profile-info">
        <div class="info-row">
          <span class="label">Name:</span>
          <span class="value">{{ profile.fullName }}</span>
        </div>
        <div class="info-row">
          <span class="label">Email:</span>
          <span class="value">{{ profile.email }}</span>
        </div>
        <div class="info-row" *ngIf="profile.location">
          <span class="label">Location:</span>
          <span class="value">{{ profile.location }}</span>
        </div>
      </div>

      <div class="skills-section">
        <h3>My Skills</h3>
        <div class="skills-list">
          <span *ngFor="let skill of profile.skills" class="skill-tag">{{ skill.name }}</span>
        </div>
      </div>

      <div class="actions">
        <a routerLink="/candidate/profile/edit" class="btn btn-primary">Edit Profile</a>
        <a routerLink="/candidate/cv-upload" class="btn btn-secondary">Upload CV</a>
        <a routerLink="/candidate/applications" class="btn btn-secondary">My Applications</a>
      </div>
    </div>
  </div>
</div>
