<div class="page-shell">
  <div class="register-card">
    <div class="register-header">
      <h1>Create Your Account</h1>
      <p>As a candidate, you can find and apply for jobs, track your applications and build your career.</p>
    </div>

    <form class="register-form" (ngSubmit)="submit()">
      <label>
        <span>Full Name</span>
        <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Enter your full name" />
      </label>

      <label>
        <span>Email</span>
        <input type="email" placeholder="you@example.com" />
      </label>

      <label>
        <span>Password</span>
        <div class="password-wrap">
          <input type="password" placeholder="Create a password" />
          <span class="eye">◉</span>
        </div>
      </label>

      <label>
        <span>Confirm Password</span>
        <div class="password-wrap">
          <input type="password" placeholder="Confirm your password" />
          <span class="eye">◉</span>
        </div>
      </label>

      <button type="submit" class="primary-btn">Sign Up</button>
    </form>

    <p class="signin-text">Already have an account? <a routerLink="/login">Login</a></p>
  </div>

  <aside class="promo-panel" aria-label="Benefits">
    <div class="avatar">👤</div>
    <ul>
      <li>Join a growing community of skilled professionals.</li>
      <li>Build your profile</li>
      <li>Get matched with job opportunities</li>
      <li>Track your applications</li>
    </ul>
  </aside>
</div>
