@if (auth.isAuthenticated()) {
  <header class="topbar">
    <span class="brand">SkillBridge</span>
    <div class="session">
      <span class="who">
        {{ auth.currentUser()?.fullName }}
        <span class="role">{{ auth.role() }}</span>
      </span>
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>
}

<main class="app-main">
  <router-outlet />
</main>
