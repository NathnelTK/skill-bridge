<div class="auth-shell">
  <div class="brand-row">
    <div class="brand-mark">S</div>
    <div class="brand-copy">
      <span class="brand-name">SkillBridge</span>
      <small>Connect. Grow. Build Your Future.</small>
    </div>
  </div>

  <div class="login-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your account</p>

    <form class="login-form" (ngSubmit)="submit()" #loginForm="ngForm" novalidate>
      <label>
        <span>Email</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" required />
      </label>

      <label>
        <span>Password</span>
        <div class="password-wrap">
          <input type="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required />
          <span class="eye">◉</span>
        </div>
      </label>

      <button type="submit" class="primary-btn" [disabled]="!email.trim() || !password.trim()">
        Login
      </button>
    </form>

    <p class="signup-text">Don't have an account? <a routerLink="/role-select">Sign Up</a></p>
  </div>
</div>
